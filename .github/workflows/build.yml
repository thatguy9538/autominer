name: Build Scratch Code

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Build mod
        run: gradle build --no-daemon

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: scratchcode-fabric-1.21.10
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

      - name: Print jar into the log (backup way to fetch it)
        run: |
          J="$(ls build/libs/*.jar | grep -v sources | head -1)"
          echo "JARNAME $(basename "$J")"
          echo "JARSHA $(sha256sum "$J" | cut -d' ' -f1)"
          base64 -w0 "$J" | fold -w 2000 | sed 's/^/JARB64 /'

      - name: Save jar to the 'builds' branch
        if: github.ref == 'refs/heads/walker'
        continue-on-error: true
        run: |
          mkdir -p /tmp/out
          cp build/libs/*.jar /tmp/out/
          rm -f /tmp/out/*-sources.jar
          cd /tmp/out
          git init -q -b builds-walker
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Built jar from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" builds-walker
