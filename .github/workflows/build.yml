name: Build Multi Bind

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Build mod
        run: gradle build --no-daemon

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

      - name: Print jar into the log
        run: |
          J="$(ls build/libs/*.jar | grep -v sources | head -1)"
          echo "JARNAME $(basename "$J")"
          echo "JARSHA $(sha256sum "$J" | cut -d' ' -f1)"
          base64 -w0 "$J" | fold -w 2000 | sed 's/^/JARB64 /'


