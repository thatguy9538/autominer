name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Build mod
        run: gradle build --no-daemon

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

      - name: Print jar into the log
        run: |
          J=$(ls build/libs/*.jar | grep -v sources)
          echo "JARNAME $(basename $J)"
          echo "JARSHA $(sha256sum $J | cut -d' ' -f1)"
          base64 -w0 "$J" | fold -w 2000 | sed 's/^/JARB64 /'


      - name: API dump
        if: always()
        run: |
          set +e
          MC=$(find ~/.gradle -name "minecraft-merged-1.21.10-net.fabricmc.yarn*.jar" | grep -v sources | head -1)
          MM=$(find ~/.gradle -name "modmenu-16.0.1*.jar" | grep -v sources | head -1)
          FK=$(find ~/.gradle -name "fabric-key-binding-api-v1*.jar" | grep -v sources | head -1)
          echo "APIMM $MM"
          for c in net.minecraft.client.option.KeyBinding net.minecraft.client.util.InputUtil\$Key com.terraformersmc.modmenu.api.ModMenuApi com.terraformersmc.modmenu.api.ConfigScreenFactory net.fabricmc.fabric.api.client.keybinding.v1.KeyBindingHelper net.minecraft.client.gui.widget.TextFieldWidget net.minecraft.client.gui.screen.Screen; do
            javap -cp "$MC:$MM:$FK" "$c" 2>&1 | grep -iE "class |interface |static|public .*\(|Error" | grep -viE "lambda|synthetic" | sed "s|^|APIX |"
          done
